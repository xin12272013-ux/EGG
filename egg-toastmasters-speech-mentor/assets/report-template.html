<!DOCTYPE html>
<!--
  蛋导 · 评估报告/改稿 PDF 模板
  ─────────────────────────────────────────────
  用法：
  1. 复制到工作区，填入内容
  2. 换色系：只改下方 :root 里的 4 个变量（已有色系见文末注释）
  3. 打印：见 SKILL.md「评估报告输出：HTML → PDF」章节

  组件速查：
    .cover 封面            h2 章节标题        table 通用表格
    .score 分数大字报      .note 黄色提示框   .danger 红色警告框
    .quote 引用块          .todo 蓝色行动框   .script 稿件段
    .cue 蓝色标注(动作)    .cue.p 红标注(停顿) .mod 橙虚线【修改】标注
    .del 删除线(原文删减)  .add / .gold 金句  .pb 强制分页
    .legend 标注说明条     .cmp 对比表(左46%)
  ─────────────────────────────────────────────
  大表分页（重要）：30 行以上的表格配 table{page-break-inside:avoid} 会被整块推到下一页，
  留下大片空白。解法——给大表单独加 class="brk"，并在 CSS 里配：
      thead { display: table-header-group; }   /* 表头跨页重复 */
      tr    { page-break-inside: avoid; }      /* 单行不撕裂 */
      table.brk { page-break-inside: auto; }   /* 允许大表跨页 */
  实测：同一份文档加这三条后 16 页 → 14 页，且表格连贯。
  ─────────────────────────────────────────────
  已用色系：暖橙 #d97706 / 青绿 #0d9488 / 紫 #7c3aed / 靛蓝 #1d4ed8
            正红 #b91c1c（冠军验收）/ 玫红 #be123c（改稿）/ 深青绿 #0f766e（动作与道具）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>标题</title>
<style>
  :root {
    --primary: #1d4ed8;        /* 主色：标题/大字报/金句 */
    --primary-dark: #1e40af;   /* 深主色：h2 文字/表头字 */
    --primary-light: #dbeafe;  /* 浅主色：表头底/标注底 */
    --primary-border: #93c5fd; /* 边框：h2 竖线/虚线分隔 */
  }
  @page { size: A4; margin: 18mm 16mm 16mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: #1a1a1a; background: #fff; line-height: 1.75; font-size: 10.5pt;
    margin: 0; padding: 0;
  }
  .cover { text-align: center; padding: 50px 0 34px;
           border-bottom: 3px solid var(--primary); margin-bottom: 24px; }
  .cover .kicker { font-size: 10pt; letter-spacing: 4px; color: var(--primary); margin-bottom: 14px; }
  .cover h1 { font-size: 24pt; margin: 0 0 10px; color: #111; letter-spacing: 2px; }
  .cover .sub { font-size: 11pt; color: #666; }
  .cover .meta { margin-top: 20px; font-size: 9.5pt; color: #888; }

  h2 { font-size: 14pt; color: var(--primary-dark); border-left: 5px solid var(--primary);
       padding-left: 10px; margin: 28px 0 12px; page-break-after: avoid; }
  h3 { font-size: 11.5pt; color: #1f2937; margin: 18px 0 8px; page-break-after: avoid; }
  p { margin: 6px 0; }

  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  table.brk { page-break-inside: auto; }   /* 30 行以上大表加此 class，允许跨页，表头自动重复 */
  table { width: 100%; border-collapse: collapse; margin: 10px 0 14px; font-size: 9.5pt;
          page-break-inside: avoid; }
  th, td { border: 1px solid #d1d5db; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--primary-light); font-weight: 600; color: var(--primary-dark); }
  tbody tr:nth-child(even) td { background: #fafafa; }
  td.c { text-align: center; }
  .narrow { width: 18%; }

  .note { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 6px;
          padding: 10px 14px; margin: 12px 0; font-size: 9.5pt; color: #78350f;
          page-break-inside: avoid; }
  .danger { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 6px;
            padding: 11px 15px; margin: 12px 0; font-size: 9.5pt; color: #7f1d1d;
            page-break-inside: avoid; }
  .quote { background: #f3f4f6; border-left: 4px solid #9ca3af; padding: 10px 14px;
           margin: 12px 0; font-size: 10pt; color: #374151; page-break-inside: avoid; }

  .cue { display: inline-block; background: var(--primary-light); color: var(--primary-dark);
         border: 1px solid var(--primary-border); border-radius: 4px;
         padding: 0 6px; margin: 0 2px; font-size: 8.5pt; white-space: nowrap; }
  .cue.p { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .mod { display: inline-block; background: #fef3c7; color: #92400e; border: 1px dashed #f59e0b;
         border-radius: 4px; padding: 0 6px; margin: 0 2px; font-size: 8.5pt; }
  .del { color: #9ca3af; text-decoration: line-through; }
  .add { color: var(--primary); font-weight: 600; }
  .gold { color: var(--primary); font-weight: 600; }

  .score { text-align: center; padding: 26px 0 20px; page-break-inside: avoid; }
  .score .big { font-size: 58pt; font-weight: 700; color: var(--primary); line-height: 1; }
  .score .of { font-size: 14pt; color: #9ca3af; }
  .score .lvl { font-size: 16pt; color: var(--primary-dark); font-weight: 600;
                margin-top: 10px; letter-spacing: 2px; }
  .score .bar { width: 78%; height: 11px; background: #e5e7eb; border-radius: 6px;
                margin: 18px auto 6px; position: relative; }
  .score .bar i { position: absolute; left: 0; top: 0; height: 11px; border-radius: 6px;
                  background: var(--primary); }
  .score .scale { display: flex; justify-content: space-between; width: 78%; margin: 0 auto;
                  font-size: 8pt; color: #9ca3af; }

  .script { border: 1px solid #e5e7eb; border-radius: 6px;
            padding: 13px 16px; margin: 11px 0; page-break-inside: avoid; }
  .script .seg { font-size: 9pt; font-weight: 600; letter-spacing: 1px;
                 border-bottom: 1px dashed var(--primary-border);
                 padding-bottom: 4px; margin-bottom: 8px; color: var(--primary); }
  .script p { margin: 7px 0; }
  .peak { background: #eff6ff; border-color: #bfdbfe; }

  .todo { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px;
          padding: 11px 15px; margin: 11px 0; page-break-inside: avoid; }
  .todo .n { font-weight: 700; color: var(--primary-dark); }
  .foot { margin-top: 26px; padding-top: 12px; border-top: 1px solid #e5e7eb;
          font-size: 9pt; color: #9ca3af; text-align: center; }
  .pb { page-break-before: always; }
  .legend { background:#fafafa; border:1px solid #e5e7eb; border-radius:6px; padding:9px 13px;
            font-size:9pt; margin:10px 0; page-break-inside:avoid; }
  .cmp td:first-child { width: 46%; }
</style>
</head>
<body>

<!-- ===== 封面 ===== -->
<div class="cover">
  <div class="kicker">EGG 头马俱乐部 · 蛋导教练</div>
  <h1><!-- 报告主标题 --></h1>
  <div class="sub"><!-- 副标题：演讲题目 --></div>
  <div class="meta"><!-- 时长 / 字数 / 交付类型 --></div>
</div>

<!-- ===== 素材说明（ASR 转写来源、无画面等限制，必写） ===== -->
<div class="note">
<b>评估素材说明：</b><!-- 原文来源、是否含画面、ASR 同音字误差举例 -->
</div>

<!-- ===== 章节模板：复制此段即可 ===== -->
<h2>一、<!-- 章节名 --></h2>
<p><!-- 正文 --></p>

<table>
  <thead><tr><th class="narrow"><!-- 列1 --></th><th><!-- 列2 --></th><th class="narrow"><!-- 列3 --></th></tr></thead>
  <tbody>
    <tr><td><!-- --></td><td><!-- --></td><td class="c"><!-- 判定 --></td></tr>
  </tbody>
</table>

<!-- ===== 分数大字报（模式B 用） ===== -->
<div class="score">
  <div class="big"><!-- 分数 --></div>
  <div class="of">/ 100</div>
  <div class="lvl"><!-- 级别，如：俱乐部级 · 即兴中上 --></div>
  <div class="bar"><i style="width:61%"></i></div>
  <div class="scale"><span>新手 40</span><span>俱乐部 60</span><span>小区 75</span><span>大区 88</span></div>
</div>

<!-- ===== 稿件段（模式C/模式A 用） ===== -->
<div class="script">
  <div class="seg"><!-- 【0:00 – 0:12】段落名 --></div>
  <p><span class="cue">停顿</span> <!-- 正文 --><span class="gold"><!-- 金句 --></span></p>
</div>

<!-- ===== 行动框（每晚就能练 / 打磨点） ===== -->
<div class="todo">
<span class="n"><!-- 动作名 --></span><br>
<!-- 内容 -->
</div>

<div class="foot"><!-- EGG 头马俱乐部 · 蛋导教练 ｜ 模式X ｜ 日期 --></div>

</body>
</html>
